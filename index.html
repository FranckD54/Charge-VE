<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charge VE</title>

<style>
:root{
--bg:#ffffff;--txt:#000;--card:#f2f2f2;
--ok:#2e7d32;--warn:#f9a825;--bad:#c62828;
--on:#1e88e5;--off:#bbb;
}
@media(prefers-color-scheme:dark){
:root{--bg:#121212;--txt:#fff;--card:#1e1e1e;}
}
body{font-family:-apple-system;background:var(--bg);color:var(--txt);margin:20px;}
h1{font-size:22px;}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px;}
button{width:100%;padding:12px;font-size:16px;}
input,select{width:100%;}
label{display:block;margin-top:8px;}
.verdict{font-size:18px;font-weight:bold;}
.ok{color:var(--ok);} .warn{color:var(--warn);} .bad{color:var(--bad);}
.hidden{display:none;}
.readonly{opacity:0.5;}
nav button{width:49%;}
</style>
</head>

<body>

<h1>Charge VE</h1>

<nav>
<button onclick="show('simu')">Simulation</button>
<button onclick="show('param')">Paramètres</button>
</nav>

<!-- SIMULATION -->
<div id="simu">

<div class="card">
<label>Mode</label>
<select id="mode">
<option value="manuel">Manuel</option>
<option value="auto">Automatique</option>
</select>

<button id="autoBtn" class="hidden" style="margin-top:12px" onclick="auto()">
1 clic – Régler la charge
</button>
</div>

<div class="card">
<label>Charge actuelle : <span id="socNowVal">40</span>%</label>
<input type="range" id="socNow" min="0" max="100" value="40">

<label>Objectif : <span id="socTargetVal">80</span>%</label>
<input type="range" id="socTarget" min="0" max="100" value="80">
</div>

<div class="card">
<label>Ampérage VE : <span id="ampVal">24</span> A (<span id="kwVal"></span> kW)</label>
<input type="range" id="amp" min="6" max="32" step="2" value="24">
</div>

<div class="card">
<h3>Appareils actifs</h3>
<div id="devicesSimu"></div>
</div>

<div class="card verdict" id="verdict"></div>
<div id="endInfo"></div>

</div>

<!-- PARAMETRES -->
<div id="param" class="hidden">

<div class="card">
<h3>Réseau</h3>
<label>Abonnement</label>
<select id="kva">
<option>6</option><option>9</option><option selected>12</option><option>15</option><option>18</option>
</select>
<div id="kvaInfo"></div>

<label>Marge sécurité (%)</label>
<select id="margin">
<option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option>
</select>
<div id="limitInfo"></div>

<p>Type réseau : Monophasé 230 V</p>
</div>

<div class="card">
<h3>Véhicule</h3>
<label>Nom</label><input id="carName" value="BMW i5">
<label>Batterie (kWh)</label><input id="battery" type="number" value="81">
<label>Intensité max AC (A)</label><input id="carMaxA" type="number" value="32">
</div>

<div class="card">
<h3>Appareils (valeurs)</h3>
<div id="devicesParam"></div>
<button onclick="addDevice()">➕ Ajouter un appareil</button>
</div>

</div>

<script>
let devices=[
{name:"Lave-linge",a:12,on:false},
{name:"Lave-vaisselle",a:10,on:false},
{name:"Sèche-linge",a:4,on:false},
{name:"Fond maison",a:3,on:true}
];

function show(id){
simu.classList.toggle("hidden",id!="simu");
param.classList.toggle("hidden",id!="param");
}

function renderDevices(){
let s="",p="";
devices.forEach((d,i)=>{
s+=`<label><input type="checkbox" ${d.on?"checked":""}
onchange="devices[${i}].on=this.checked;display()">
${d.name}</label>`;

p+=`${d.name} :
<input type="number" value="${d.a}"
oninput="devices[${i}].a=this.value;display()"> A<br>`;
});
devicesSimu.innerHTML=s;
devicesParam.innerHTML=p;
}

function addDevice(){
let n=prompt("Nom appareil ?");
let a=parseFloat(prompt("Intensité en A ?"));
if(n&&a){devices.push({name:n,a:a,on:false});}
renderDevices();display();
}

function auto(){
let maxA=Math.min(32,carMaxA.value);
for(let a=maxA;a>=6;a-=2){
if(totalCurrent(a)<=getLimitA()){amp.value=a;break;}
}
display();
}

function getLimitA(){
let I=kva.value*1000/230;
return I*(1-margin.value/100);
}

function totalCurrent(a){
let sum=a;
devices.forEach(d=>{if(d.on) sum+=Number(d.a);});
return sum;
}

mode.onchange=()=>{
autoBtn.classList.toggle("hidden",mode.value!="auto");
amp.disabled = mode.value=="auto";
amp.classList.toggle("readonly",mode.value=="auto");
};

function display(){
socNowVal.textContent=socNow.value;
socTargetVal.textContent=socTarget.value;
ampVal.textContent=amp.value;
kwVal.textContent=(amp.value*230/1000).toFixed(1);

kvaInfo.textContent=`${kva.value} kVA ≈ ${(kva.value*1000/230).toFixed(0)} A`;
limitInfo.textContent=`Courant max utilisable ≈ ${getLimitA().toFixed(0)} A`;

let batt=battery.value;
let need=(socTarget.value-socNow.value)/100*batt;
let power=amp.value*230/1000;
let charged=Math.min(need,power*6);
let finalSoc=Number(socNow.value)+charged/batt*100;

let txt="",cls="";
if(totalCurrent(Number(amp.value))>getLimitA()){
txt="Recharge impossible – limite réseau";
cls="bad";
}else if(finalSoc>=socTarget.value){
txt="Recharge possible ✔";
cls="ok";
}else{
txt="Recharge partielle ⚠️";
cls="warn";
}
verdict.className="card verdict "+cls;
verdict.innerHTML=txt;

endInfo.innerHTML=
`SOC atteint : <b>${finalSoc.toFixed(0)} %</b><br>
Ampérage : <b>${amp.value} A</b> (${(amp.value*230/1000).toFixed(1)} kW)`;
}

["socNow","socTarget","amp","kva","margin","battery","carMaxA"].forEach(id=>{
document.getElementById(id).oninput=display;
});

renderDevices();
display();
</script>

</body>
</html>
